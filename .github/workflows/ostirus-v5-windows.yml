name: OsTIrus_mod_v5 Windows VST3

# Builds only the OsTIrus_mod VST3 variants (side-by-side builds of OsTIrus, see
# source/osTIrusJucePlugin/CMakeLists.txt) for Windows x64:
#   OsTIrus_mod_v5  - OsTIrus 2.2.25 + 32 host knobs, Layer, user bank presets;
#                     data folder shared with OsTIrus
#                     (source/framework/juce/jucePluginLib/hostMacros.h)
on:
  push:
    branches: [ ostirus-v5 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: OsTIrus_mod_v5
            synth: Ttv5
            fx: Ttw5
            macros: ON
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: >
        cmake -B build -G "Visual Studio 17 2022" -A x64
        -Dgearmulator_BUILD_JUCEPLUGIN=ON
        -Dgearmulator_BUILD_JUCEPLUGIN_VST3=ON
        -Dgearmulator_BUILD_JUCEPLUGIN_VST2=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_AU=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_CLAP=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_LV2=OFF
        -Dgearmulator_BUILD_FX_PLUGIN=OFF
        -Dgearmulator_SYNTH_OSIRUS=OFF
        -Dgearmulator_SYNTH_OSTIRUS=ON
        -Dgearmulator_SYNTH_VAVRA=OFF
        -Dgearmulator_SYNTH_XENIA=OFF
        -Dgearmulator_SYNTH_NODALRED2X=OFF
        -Dgearmulator_SYNTH_JE8086=OFF
        -Dgearmulator_SYNTH_88EMU=OFF
        -DOSTIRUS_PRODUCT_NAME=${{ matrix.product }}
        -DOSTIRUS_CODE_SYNTH=${{ matrix.synth }}
        -DOSTIRUS_CODE_FX=${{ matrix.fx }}
        -DGEARMULATOR_HOST_MACROS=${{ matrix.macros }}
        -DOSTIRUS_DATA_NAME=OsTIrus

    - name: Build
      run: cmake --build build --config Release --target osTIrusJucePlugin_VST3 --parallel 4

    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.product }}-VST3-Windows-x64
        path: bin/plugins/Release/VST3/${{ matrix.product }}.vst3
        if-no-files-found: error
